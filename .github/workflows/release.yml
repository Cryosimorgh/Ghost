name: Build and publish Ghost

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghost-release
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python rendezvous protocol
        run: |
          python3 -m pip install --quiet -r directory/requirements.txt
          python3 -m unittest discover -s directory -p 'test_*.py'
          python3 directory/ghost_directory.py --bind 127.0.0.1 --publish-port 48591 --lookup-port 48592 --max-memory-mb 1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 0.5
          GHOST_DIR_PUBLISH_PORT=48591 GHOST_DIR_LOOKUP_PORT=48592 go test -run TestPythonDirectoryAcrossIndependentNodes -v
      - run: node --check web/app.js
      - name: Generate Windows icon resource
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64-posix
          python3 -m pip install --user --quiet pillow cairosvg
          python3 scripts/build_icons.py
          x86_64-w64-mingw32-windres -i assets/ghost.rc -o rsrc_windows_amd64.syso
      - name: Build Windows and Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows dist/linux
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o dist/windows/Ghost.exe .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/windows/Ghost-console.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/linux/Ghost-linux-amd64 .
          cp assets/ghost.ico 'Start Ghost.cmd' README.md dist/windows/
          cp README.md assets/ghost-256.png dist/linux/
          cp 'Start Ghost.sh' dist/linux/
          chmod +x dist/linux/'Start Ghost.sh'
          cp dist/windows/Ghost.exe dist/Ghost-Windows-amd64.exe
          cp dist/linux/Ghost-linux-amd64 dist/Ghost-Linux-amd64
          chmod +x dist/Ghost-Linux-amd64
          (cd dist/windows && zip -q ../Ghost-Windows-v1.5.0.zip *)
          (cd dist/linux && zip -q ../Ghost-Linux-v1.5.0.zip *)
          git archive --format=zip HEAD -o dist/Ghost-Source-v1.5.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: |
            dist/Ghost-*.zip
            dist/Ghost-Windows-amd64.exe
            dist/Ghost-Linux-amd64
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile installable Android preview
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Ghost-Android-v1.5.0-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: dist/Ghost-Android-v1.5.0-preview.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android-package
          path: dist
      - name: Publish v1.5.0 without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/Ghost-* > dist/SHA256SUMS.txt
          if gh release view v1.5.0 >/dev/null 2>&1; then
            echo 'v1.5.0 already exists; existing release preserved.'
            exit 0
          fi
          gh release create v1.5.0 dist/Ghost-* dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'Ghost v1.5.0 — Focused UI & in-app network settings' \
            --notes 'Focused Chats / Connect / Audio / Settings layout, in-GUI directory and node configuration with persistence and restart, manual or opt-in public IP detection, directory reachability test, and lossless 64-bit code copy. Existing Direct Connect, LAN discovery, directory, voice, and files retained. Android APK remains a WebView preview requiring a reachable Ghost desktop node, not a standalone peer. Optional separate Direct Connect funnel: a 10-minute, one-use opaque invite code; an OS-selected ephemeral or explicitly forwarded pairing TCP port; X25519 + AES-GCM full-duplex signaling tunnel; listening port closes after one authenticated pairing. Existing LAN discovery, manual peer URLs, and optional Python rendezvous directory preserved. The invite is a bearer secret, not IP anonymity; recipients can decrypt the IP. At least one reachable port still required. WebRTC voice/data remains separate and physical-device media testing is unverified. Android preview is not a standalone mesh node.'

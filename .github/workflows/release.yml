name: Build and publish Ghost

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghost-release
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: node --check web/app.js
      - name: Generate Windows icon resource
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64-posix
          python3 -m pip install --user --quiet pillow cairosvg
          python3 scripts/build_icons.py
          x86_64-w64-mingw32-windres -i assets/ghost.rc -o rsrc_windows_amd64.syso
      - name: Build Windows and Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows dist/linux
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o dist/windows/Ghost.exe .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/windows/Ghost-console.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/linux/Ghost-linux-amd64 .
          cp assets/ghost.ico 'Start Ghost.cmd' README.md dist/windows/
          cp README.md assets/ghost-256.png dist/linux/
          cp 'Start Ghost.sh' dist/linux/
          chmod +x dist/linux/'Start Ghost.sh'
          cp dist/windows/Ghost.exe dist/Ghost-Windows-amd64.exe
          cp dist/linux/Ghost-linux-amd64 dist/Ghost-Linux-amd64
          chmod +x dist/Ghost-Linux-amd64
          (cd dist/windows && zip -q ../Ghost-Windows-v1.1.1.zip *)
          (cd dist/linux && zip -q ../Ghost-Linux-v1.1.1.zip *)
          git archive --format=zip HEAD -o dist/Ghost-Source-v1.1.1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: |
            dist/Ghost-*.zip
            dist/Ghost-Windows-amd64.exe
            dist/Ghost-Linux-amd64
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile installable Android preview
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Ghost-Android-v1.1.1-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: dist/Ghost-Android-v1.1.1-preview.apk
          if-no-files-found: error

  release:
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-packages
          path: dist
      - name: Publish v1.1.1 without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/Ghost-* > dist/SHA256SUMS.txt
          if gh release view v1.1.1 >/dev/null 2>&1; then
            echo 'v1.1.1 already exists; existing release preserved.'
            exit 0
          fi
          gh release create v1.1.1 dist/Ghost-* dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'Ghost v1.1.1 — Standalone desktop' \
            --notes 'Standalone desktop: download and launch Ghost-Windows-amd64.exe or Ghost-Linux-amd64 (chmod +x first). All UI assets are embedded. No Java, Node.js, Go installation, npm, or external server runtime required. A normal system browser is used for the UI. Windows tray is built in. Linux desktop launches the browser automatically; headless mode: -open=false. Android preview is separately available in v1.1.0. Live WebRTC end-to-end testing remains unverified.'

name: Build and publish Ghost

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghost-release
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: node --check web/app.js
      - name: Generate Windows icon resource
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64-posix
          python3 -m pip install --user --quiet pillow cairosvg
          python3 scripts/build_icons.py
          x86_64-w64-mingw32-windres -i assets/ghost.rc -o rsrc_windows_amd64.syso
      - name: Build Windows and Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows dist/linux
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o dist/windows/Ghost.exe .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/windows/Ghost-console.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/linux/Ghost-linux-amd64 .
          cp assets/ghost.ico 'Start Ghost.cmd' README.md dist/windows/
          cp README.md assets/ghost-256.png dist/linux/
          cp 'Start Ghost.sh' dist/linux/
          chmod +x dist/linux/'Start Ghost.sh'
          cp dist/windows/Ghost.exe dist/Ghost-Windows-amd64.exe
          cp dist/linux/Ghost-linux-amd64 dist/Ghost-Linux-amd64
          chmod +x dist/Ghost-Linux-amd64
          (cd dist/windows && zip -q ../Ghost-Windows-v1.2.0.zip *)
          (cd dist/linux && zip -q ../Ghost-Linux-v1.2.0.zip *)
          git archive --format=zip HEAD -o dist/Ghost-Source-v1.2.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: |
            dist/Ghost-*.zip
            dist/Ghost-Windows-amd64.exe
            dist/Ghost-Linux-amd64
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile installable Android preview
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Ghost-Android-v1.2.0-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: dist/Ghost-Android-v1.2.0-preview.apk
          if-no-files-found: error

  release:
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-packages
          path: dist
      - name: Publish v1.2.0 without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/Ghost-* > dist/SHA256SUMS.txt
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo 'v1.2.0 already exists; existing release preserved.'
            exit 0
          fi
          gh release create v1.2.0 dist/Ghost-* dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'Ghost v1.2.0 — Independent P2P nodes' \
            --notes 'Independent Ghost nodes: no shared hub needed. Automatic LAN multicast discovery; manually entered peer addresses for remote networks; signed Ed25519 node signaling; cross-node friend requests, presence and WebRTC call setup. Windows/Linux are standalone Go executables. No public STUN server by default. A direct route/port forwarding is necessary for internet peers; no global DHT or automatic NAT traversal. Android v1.1 is not yet a standalone node. Live browser-to-browser WebRTC remains unverified.'

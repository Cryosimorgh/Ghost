name: Network tests
on:
  push:
  pull_request:

jobs:
  discovery:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r directory/requirements.txt
      - run: python -m unittest discover -s directory -v
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Cross-language discovery and peer tests
        shell: bash
        run: |
          export GHOST_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          go test -v -timeout 120s ./...
      - run: go vet ./...
      - name: Race detection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export GHOST_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          go test -race -timeout 120s ./...

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser test dependencies outside the source tree
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ghost-browser" playwright@1.56.1
          "$RUNNER_TEMP/ghost-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Discovery through direct WebRTC messages, audio, and files
        shell: bash
        run: |
          export GHOST_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export GHOST_PLAYWRIGHT_MODULE="$RUNNER_TEMP/ghost-browser/node_modules/playwright"
          export GHOST_QA_OUTPUT="$RUNNER_TEMP/ghost-browser-evidence"
          node tests/discovery-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-browser-evidence
          path: ${{ runner.temp }}/ghost-browser-evidence
          if-no-files-found: ignore

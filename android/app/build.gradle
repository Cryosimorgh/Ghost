plugins { id 'com.android.application' }
android {
    namespace 'com.cryosimorgh.ghost'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cryosimorgh.ghost'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
